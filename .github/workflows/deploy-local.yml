name: Deploy Local

# Chạy sau khi workflow "CD Docker Hub" thành công
on:
  workflow_run:
    workflows: ["CD Docker Hub"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Self-hosted runner cài trên laptop của bạn (có Docker Engine)
    runs-on: self-hosted
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra Docker
        run: docker --version

      - name: Pull image mới từ Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull product-api

      - name: Chạy lại container, chờ healthy
        run: docker compose -f docker-compose-prod.yaml up -d --wait

      - name: Danh sách container
        run: docker compose -f docker-compose-prod.yaml ps
